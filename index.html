<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wet Specimens Eat The Menu</title>
    <style>
      /* ---------- Base ---------- */
      :root {
        --green: #1a3e2d;
        --cream: #f9f3e1;
      }

      body {
        font-family: sans-serif;
        background-color: var(--green);
        color: var(--cream);
      }

      h1,
      h2,
      h3,
      .info,
      .submission {
        text-align: center;
      }

      /* ---------- Buttons ---------- */
      button {
        padding: 10px;
        margin-bottom: 15px;
        color: var(--green);
        background: var(--cream);
        border-radius: 5px;
        border: 2px solid var(--green);
        outline: 1px solid var(--cream);
        cursor: pointer;
      }

      button:hover {
        transform: scale(1.1);
      }

      button:active {
        color: var(--cream);
        background: var(--green);
      }

      button:disabled {
        opacity: 0.6;
        cursor: wait;
        transform: none;
      }

      .wrapped {
        position: fixed;
        text-align: center;
        margin-top: 20px;
        bottom: 10px;
        right: 0;
        background: #1b2d52;
        padding: 10px;
        z-index: 1000;
        border: 1px solid var(--cream);
        border-radius: 10px;
      }

      .wrapped a {
        color: #90d5ff;
        text-decoration: none;
      }

      /* ---------- Shared dashed box (leaderboard + stats) ---------- */
      .dashed-box {
        --dash: repeating-linear-gradient(
          90deg,
          var(--cream),
          var(--cream) 5px,
          transparent 5px,
          transparent 10px
        );
        --dash-v: repeating-linear-gradient(
          180deg,
          var(--cream),
          var(--cream) 5px,
          transparent 5px,
          transparent 10px
        );
        background-image: var(--dash), var(--dash-v), var(--dash), var(--dash-v);
        background-position:
          left top,
          right top,
          left bottom,
          left top;
        background-repeat: repeat-x, repeat-y, repeat-x, repeat-y;
        background-size:
          100% 5px,
          5px 100%,
          100% 5px,
          5px 100%;
        border-radius: 5px;
      }

      /* ---------- Leaderboard ---------- */
      #leaderboard {
        padding: 5px 12px;
      }

      .leaderboard-row {
        display: grid;
        grid-template-columns: 40px 1fr 80px;
        padding: 8px;
        border-bottom: 1px solid var(--cream);
      }

      .rank {
        font-weight: bold;
      }

      .dish-name {
        cursor: pointer;
        text-decoration: underline;
        transition:
          opacity 0.15s ease,
          transform 0.05s ease;
        -webkit-tap-highlight-color: transparent;
      }

      .dish-name:active {
        opacity: 0.6;
        transform: scale(0.98);
      }

      .dish-name.loading {
        opacity: 0.5;
        pointer-events: none;
        text-decoration: none;
      }

      .avg {
        text-align: right;
      }

      .count {
        display: block;
        font-size: 0.75rem;
        opacity: 0.7;
      }

      .loading-msg {
        text-align: center;
        opacity: 0.6;
        font-style: italic;
        padding: 16px 0;
      }

      /* ---------- Modals ---------- */
      .backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
      }

      .modal {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: white;
        color: var(--green);
        border-radius: 5px;
        padding: 10px 16px;
        text-align: center;
        min-width: 250px;
        max-width: 90vw;
        max-height: 90vh;
        overflow-y: auto;
        box-sizing: border-box;
      }

      .hidden {
        display: none;
      }

      form {
        text-align: left;
      }

      label {
        display: block;
        margin-bottom: 10px;
      }

      select {
        width: 100%;
        margin-top: 4px;
      }

      textarea {
        width: 100%;
        box-sizing: border-box;
      }

      .modal-actions {
        margin-top: 15px;
        text-align: center;
      }

      ul {
        list-style-type: none;
        text-align: left;
      }

      .details-comment {
        font-style: italic;
        opacity: 0.8;
        margin-left: 1.25rem;
        font-size: 0.9em;
      }

      /* ---------- Tabs ---------- */
      .tab-nav {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-bottom: 12px;
      }

      .tab-btn {
        margin-bottom: 0;
        flex: 1;
        width: auto;
      }

      .tab-btn.active {
        background: var(--green);
        color: var(--cream);
      }

      /* ---------- Stats ---------- */
      #stats-panel {
        padding: 12px;
      }

      .stats-totals {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-bottom: 16px;
        text-align: center;
      }

      .stat-total {
        padding: 10px 4px;
        border-bottom: 1px solid var(--cream);
      }

      .stat-total .num {
        display: block;
        font-size: 1.8rem;
        font-weight: bold;
      }

      .stat-total .lbl,
      .hl-label {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }

      .section-heading {
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin: 16px 0 8px;
        border-bottom: 1px solid rgba(249, 243, 225, 0.25);
        padding-bottom: 4px;
      }

      .highlights-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 4px;
      }

      .highlight-card {
        border: 1px solid rgba(249, 243, 225, 0.3);
        border-radius: 4px;
        padding: 10px;
      }

      .hl-label {
        margin-bottom: 4px;
      }

      .hl-name {
        font-weight: bold;
        margin-bottom: 2px;
      }

      .hl-meta {
        font-size: 0.82rem;
      }

      .dist-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
        font-size: 0.85rem;
      }

      .dist-star {
        min-width: 28px;
        text-align: right;
      }

      .dist-track {
        flex: 1;
        height: 12px;
        background: rgba(249, 243, 225, 0.15);
        border-radius: 2px;
      }

      .dist-fill {
        height: 100%;
        background: var(--cream);
        border-radius: 2px;
        transition: width 0.4s ease;
      }

      .dist-count {
        min-width: 24px;
        font-size: 0.8rem;
        opacity: 0.65;
      }

      .people-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.85rem;
      }

      .people-table th {
        text-align: left;
        padding: 6px 4px;
        border-bottom: 1px solid var(--cream);
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        opacity: 0.65;
      }

      .people-table td {
        padding: 7px 4px;
        border-bottom: 1px solid rgba(249, 243, 225, 0.15);
        vertical-align: top;
      }

      .people-table .fave {
        font-size: 0.8em;
        opacity: 0.8;
      }

      /* ---------- Mobile ---------- */
      @media (max-width: 600px) {
        body {
          font-size: 16px;
        }

        h1 {
          font-size: 1.5rem;
        }

        .leaderboard-row {
          grid-template-columns: 30px 1fr auto;
          align-items: center;
          column-gap: 10px;
          padding: 10px 0;
        }

        .dish-name {
          word-break: break-word;
          line-height: 1.3;
          display: inline-block;
        }

        .avg {
          white-space: nowrap;
        }

        button {
          width: 100%;
          margin-bottom: 10px;
          font-size: 1rem;
        }

        button:hover {
          transform: none;
        }

        .modal {
          width: 90vw;
          min-width: unset;
        }

        form,
        label {
          font-size: 1rem;
        }

        select {
          font-size: 1rem;
          padding: 8px;
        }

        ul {
          padding-left: 20px;
        }

        .stats-totals {
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>

  <body>
    <div class="main">
      <div class="info">
        <h1>🏆 Wet Specimen(u)s 🏆</h1>
        <p class="subtitle">Eating everything at Monkey Motel</p>
      </div>

      <div class="submission">
        <button id="add-rating-btn">Submit Rating</button>
      </div>

      <div class="tab-nav">
        <button class="tab-btn active" id="tab-leaderboard">Leaderboard</button>
        <button class="tab-btn" id="tab-stats">Stats</button>
      </div>

      <div id="leaderboard-panel">
        <div id="leaderboard" class="dashed-box">
          <p class="loading-msg">Loading leaderboard…</p>
        </div>
      </div>

      <div id="stats-panel" class="dashed-box hidden">
        <p id="stats-loading" class="loading-msg">Loading stats…</p>
        <div id="stats-content" class="hidden"></div>
      </div>

      <div class="wrapped">
        <a href="/winterwrapped2026.html">❄️ Winter Wrapped</a>
      </div>

      <!-- Rating Modal -->
      <div id="rating-modal" class="hidden">
        <div class="backdrop" data-close="rating-modal"></div>
        <div class="modal">
          <form id="rating-form">
            <h3>Submit Rating</h3>

            <label>
              Who are u?
              <select id="person-select" required>
                <option value="" disabled selected>Select your name</option>
              </select>
            </label>

            <label>
              What did u eat?
              <select id="dish-select" required>
                <option value="" disabled selected>Select a dish</option>
              </select>
            </label>

            <label>
              How was it?
              <select id="rating" required>
                <option value="" disabled selected>Pick a rating</option>
                <option value="1">⭐️</option>
                <option value="2">⭐️⭐️</option>
                <option value="3">⭐️⭐️⭐️</option>
                <option value="4">⭐️⭐️⭐️⭐️</option>
                <option value="5">⭐️⭐️⭐️⭐️⭐️</option>
              </select>
            </label>

            <label for="comment">Thoughts???? (optional)</label>
            <textarea
              id="comment"
              placeholder="Tell us how u really feel"
              rows="3"
            ></textarea>

            <div class="modal-actions">
              <button type="submit" id="submit-rating">Submit</button>
              <button type="button" data-close="rating-modal">Cancel</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Details Modal -->
      <div id="details-modal" class="hidden">
        <div class="backdrop" data-close="details-modal"></div>
        <div class="modal">
          <h3 id="details-title"></h3>
          <ul id="details-list"></ul>
          <button data-close="details-modal">Close</button>
        </div>
      </div>
    </div>

    <script>
      const API_URL =
        "https://script.google.com/macros/s/AKfycbx2Fqy6G3Cu9_6GXumdgknTXCsMQrn9kH-quciydlxTC1QwZ7zK4vOb5aCvLfDQh1u7xg/exec";

      // Bayesian ranking: how many "phantom" average ratings each dish starts with.
      // Higher = a dish needs more ratings before it can climb to the top.
      const RANK_PRIOR_WEIGHT = 5;

      let dishesCache = [];
      let peopleCache = [];
      let statsCache = null;
      const ratingsCache = new Map(); // dish_id -> ratings, cleared on submit

      const $ = (id) => document.getElementById(id);

      /* ---------- Helpers ---------- */
      function escapeHtml(value) {
        return String(value ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }

      function renderStars(value) {
        if (!value) return "—";
        const rounded = Math.round(value * 2) / 2;
        return "⭐️".repeat(Math.floor(rounded)) + (rounded % 1 ? "½" : "");
      }

      async function api(action, params = {}) {
        const qs = new URLSearchParams({ action, ...params });
        const res = await fetch(`${API_URL}?${qs}`);
        if (!res.ok) throw new Error(`${action} failed (${res.status})`);
        return res.json();
      }

      // localStorage can throw (private mode, blocked storage) — never let it break the app
      function readCache(key) {
        try {
          return JSON.parse(localStorage.getItem(key));
        } catch {
          return null;
        }
      }

      function writeCache(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch {}
      }

      /* ---------- Ranking ---------- */
      function rankDishes(dishes) {
        const rated = dishes.filter((d) => d.average && d.count);

        // Fallback: if the API doesn't send counts, keep the old plain-average sort
        if (dishes.some((d) => d.average) && rated.length === 0) {
          console.warn(
            "getDishes has no `count` field — add it in Apps Script to enable fair ranking.",
          );
          return dishes.sort((a, b) => (b.average || 0) - (a.average || 0));
        }

        const total = rated.reduce((s, d) => s + d.count, 0);
        const globalAvg = total
          ? rated.reduce((s, d) => s + d.average * d.count, 0) / total
          : 0;

        dishes.forEach((d) => {
          d.score =
            d.average && d.count
              ? (RANK_PRIOR_WEIGHT * globalAvg + d.average * d.count) /
                (RANK_PRIOR_WEIGHT + d.count)
              : 0;
        });

        // Ties broken by number of ratings (more evidence wins)
        return dishes.sort(
          (a, b) => b.score - a.score || (b.count || 0) - (a.count || 0),
        );
      }

      /* ---------- Rendering ---------- */
      function renderLeaderboard() {
        const board = $("leaderboard");
        board.innerHTML = "";

        dishesCache.forEach((dish, index) => {
          const row = document.createElement("div");
          row.className = "leaderboard-row";
          if (dish.status === "retired") row.style.opacity = "0.45";

          const countLabel = dish.count
            ? `<span class="count">${dish.count} rating${dish.count === 1 ? "" : "s"}</span>`
            : "";

          row.innerHTML = `
            <span class="rank">${index + 1}</span>
            <span class="dish-name">${escapeHtml(dish.name)}</span>
            <span class="avg" title="${dish.average ? dish.average.toFixed(2) : ""}">
              ${renderStars(dish.average)}${countLabel}
            </span>
          `;

          const dishEl = row.querySelector(".dish-name");
          dishEl.addEventListener("click", () =>
            viewDetails(dish.id, dish.name, dishEl),
          );

          board.appendChild(row);
        });

        populateDishSelect();
      }

      function populateDishSelect() {
        const select = $("dish-select");
        const current = select.value;
        select.innerHTML = `<option value="" disabled selected>Select a dish</option>`;

        dishesCache
          .filter((dish) => dish.status === "active")
          .sort((a, b) => a.name.localeCompare(b.name))
          .forEach((dish) => select.add(new Option(dish.name, dish.id)));

        if (current) select.value = current;
      }

      function populatePeopleSelect() {
        const select = $("person-select");
        const current = select.value;
        select.innerHTML = `<option value="" disabled selected>Select your name</option>`;
        peopleCache.forEach((name) => select.add(new Option(name, name)));
        if (current) select.value = current;
      }

      /* ---------- Data Loading ---------- */
      async function loadLeaderboard() {
        try {
          const dishes = await api("getDishes");
          writeCache("wse-dishes", dishes);
          dishesCache = rankDishes(dishes);
          renderLeaderboard();
        } catch (err) {
          console.error(err);
          if (!dishesCache.length) {
            $("leaderboard").innerHTML =
              `<p class="loading-msg">Couldn’t load the leaderboard — refresh to try again.</p>`;
          }
        }
      }

      async function loadPeople() {
        try {
          peopleCache = await api("getPeople");
          writeCache("wse-people", peopleCache);
          populatePeopleSelect();
        } catch (err) {
          console.error(err);
        }
      }

      /* ---------- Modals ---------- */
      const openModal = (id) => $(id).classList.remove("hidden");
      const closeModal = (id) => $(id).classList.add("hidden");

      $("add-rating-btn").addEventListener("click", () =>
        openModal("rating-modal"),
      );

      // Any element with data-close="<modal id>" closes that modal (buttons + backdrop)
      document.addEventListener("click", (e) => {
        const target = e.target.closest("[data-close]");
        if (target && !target.disabled) closeModal(target.dataset.close);
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && !isSubmittingRating) {
          closeModal("rating-modal");
          closeModal("details-modal");
        }
      });

      /* ---------- Submit Rating ---------- */
      let isSubmittingRating = false;

      $("rating-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        if (isSubmittingRating) return;
        isSubmittingRating = true;

        const form = $("rating-form");
        const submitBtn = $("submit-rating");
        const originalBtnText = submitBtn.textContent;
        const controls = Array.from(
          form.querySelectorAll("select, textarea, button"),
        );

        const data = {
          dish_id: $("dish-select").value,
          person: $("person-select").value,
          rating: Number($("rating").value),
          comment: $("comment").value.trim(),
        };

        controls.forEach((el) => (el.disabled = true));
        submitBtn.textContent = "Submitting…";

        try {
          if (!data.dish_id || !data.person || !data.rating) {
            throw new Error("Missing required fields");
          }

          const res = await fetch(API_URL, {
            method: "POST",
            body: JSON.stringify(data),
            headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids CORS preflight with Apps Script
          });
          if (!res.ok) throw new Error(`Submit failed (${res.status})`);

          // Success — remember who they are so they don't have to pick again
          const person = data.person;
          form.reset();
          $("person-select").value = person;
          closeModal("rating-modal");

          statsCache = null; // stats refresh next time they're viewed
          ratingsCache.delete(String(data.dish_id));
          await loadLeaderboard();
          if (!$("stats-panel").classList.contains("hidden")) loadStats();
        } catch (err) {
          console.error(err);
          alert("Couldn’t submit right now — please try again.");
        } finally {
          isSubmittingRating = false;
          controls.forEach((el) => (el.disabled = false));
          submitBtn.textContent = originalBtnText;
        }
      });

      /* ---------- Details ---------- */
      let detailsLoading = false;

      function renderRatings(list, ratings) {
        list.innerHTML = "";

        if (!ratings.length) {
          list.innerHTML = `<li class="loading-msg">No ratings yet.</li>`;
          return;
        }

        ratings.forEach((r) => {
          const li = document.createElement("li");

          const stars = document.createElement("div");
          stars.textContent = `${r.person}: ${"⭐️".repeat(r.rating)}`;
          li.appendChild(stars);

          const commentText = r.comment || r.comments || r.note || r.notes || "";
          if (commentText) {
            const comment = document.createElement("div");
            comment.className = "details-comment";
            comment.textContent = commentText;
            li.appendChild(comment);
          }

          list.appendChild(li);
        });
      }

      async function viewDetails(dishId, dishName, clickedEl) {
        if (detailsLoading) return;

        const list = $("details-list");
        $("details-title").textContent = dishName;
        openModal("details-modal");

        // Already fetched this dish? Show instantly.
        const key = String(dishId);
        if (ratingsCache.has(key)) {
          renderRatings(list, ratingsCache.get(key));
          return;
        }

        detailsLoading = true;
        clickedEl?.classList.add("loading");
        list.innerHTML = `<li class="loading-msg">Loading…</li>`;

        try {
          const ratings = await api("getRatings", { dish_id: dishId });
          ratingsCache.set(key, ratings);
          renderRatings(list, ratings);
        } catch (err) {
          console.error(err);
          list.innerHTML = `<li class="loading-msg">Couldn’t load ratings. Try again.</li>`;
        } finally {
          detailsLoading = false;
          clickedEl?.classList.remove("loading");
        }
      }

      /* ---------- Tabs ---------- */
      function showTab(name) {
        const isStats = name === "stats";
        $("leaderboard-panel").classList.toggle("hidden", isStats);
        $("stats-panel").classList.toggle("hidden", !isStats);
        $("tab-leaderboard").classList.toggle("active", !isStats);
        $("tab-stats").classList.toggle("active", isStats);
        if (isStats && !statsCache) loadStats();
      }

      $("tab-leaderboard").addEventListener("click", () =>
        showTab("leaderboard"),
      );
      $("tab-stats").addEventListener("click", () => showTab("stats"));

      /* ---------- Stats ---------- */
      async function loadStats() {
        const loadingEl = $("stats-loading");
        const contentEl = $("stats-content");

        try {
          // Stats and the Guinness count load in parallel
          const [stats, guinness] = await Promise.all([
            api("getStats"),
            api("getGuinness").catch(() => ({ count: 0 })),
          ]);
          statsCache = stats;
          loadingEl.classList.add("hidden");
          contentEl.classList.remove("hidden");
          renderStats(stats, guinness.count || 0);
        } catch (err) {
          console.error(err);
          loadingEl.classList.remove("hidden");
          loadingEl.textContent = "Couldn't load stats — try again.";
        }
      }

      function highlightCard(label, dish, meta) {
        if (!dish) return "";
        return `
          <div class="highlight-card">
            <div class="hl-label">${label}</div>
            <div class="hl-name">${escapeHtml(dish.name)}</div>
            <div class="hl-meta">${meta}</div>
          </div>`;
      }

      function renderStats(s, guinnessCount) {
        const maxDist = Math.max(...Object.values(s.ratingDist));

        $("stats-content").innerHTML = `
          <div class="stats-totals">
            <div class="stat-total">
              <span class="num">${s.totalRatings}</span>
              <span class="lbl">Ratings</span>
            </div>
            <div class="stat-total">
              <span class="num">${s.totalSessions}</span>
              <span class="lbl">Sessions</span>
            </div>
            <div class="stat-total">
              <span class="num">${s.uniqueRaters}</span>
              <span class="lbl">Raters</span>
            </div>
            <div class="stat-total">
              <span class="num">${guinnessCount || "—"}</span>
              <span class="lbl">🍺 Guinnesses Drunk</span>
            </div>
          </div>

          <p class="section-heading">Highlights</p>
          <div class="highlights-grid">
            ${highlightCard("🏆 Top rated", s.topDish, s.topDish && `${s.topDish.average.toFixed(2)} avg · ${s.topDish.count} ratings`)}
            ${highlightCard("🔁 Most ordered", s.mostOrdered, s.mostOrdered && `${s.mostOrdered.count} ratings · ${s.mostOrdered.average.toFixed(2)} avg`)}
            ${highlightCard("💀 Biggest flop", s.flopDish, s.flopDish && `${s.flopDish.average.toFixed(2)} avg · ${s.flopDish.count} ratings`)}
            ${highlightCard("🌶️ Most controversial", s.mostControversial, s.mostControversial && `σ ${s.mostControversial.stdDev.toFixed(2)} · ${s.mostControversial.average.toFixed(2)} avg`)}
          </div>

          <p class="section-heading">Rating distribution</p>
          <div style="margin-bottom:16px;">
            ${[5, 4, 3, 2, 1]
              .map(
                (star) => `
              <div class="dist-row">
                <span class="dist-star">${star}★</span>
                <div class="dist-track">
                  <div class="dist-fill" style="width:${maxDist ? Math.round((s.ratingDist[star] / maxDist) * 100) : 0}%"></div>
                </div>
                <span class="dist-count">${s.ratingDist[star]}</span>
              </div>`,
              )
              .join("")}
          </div>

          <p class="section-heading">The specimens</p>
          <table class="people-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Avg</th>
                <th>#</th>
                <th>5⭐️s</th>
                <th>Fave</th>
              </tr>
            </thead>
            <tbody>
              ${s.people
                .map(
                  (p) => `
                <tr>
                  <td>${escapeHtml(p.name)}</td>
                  <td>${p.averageGiven.toFixed(2)}</td>
                  <td>${p.totalRatings}</td>
                  <td>${p.fiveStars}</td>
                  <td class="fave">${escapeHtml(p.favouriteDish) || "—"}</td>
                </tr>`,
                )
                .join("")}
            </tbody>
          </table>
        `;
      }

      /* ---------- Init ---------- */
      // 1. Show the last-known data instantly (if this phone has visited before)
      const cachedDishes = readCache("wse-dishes");
      if (Array.isArray(cachedDishes) && cachedDishes.length) {
        dishesCache = rankDishes(cachedDishes);
        renderLeaderboard();
      }
      const cachedPeople = readCache("wse-people");
      if (Array.isArray(cachedPeople)) {
        peopleCache = cachedPeople;
        populatePeopleSelect();
      }

      // 2. Refresh both from the sheet in parallel
      Promise.all([loadLeaderboard(), loadPeople()]);
    </script>
  </body>
</html>
